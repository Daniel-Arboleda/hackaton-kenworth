services:
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8501}:8501"
    environment:
      KENWORTH_RESOURCES: /app/resources
      KENWORTH_DB: /app/data/decisions.sqlite
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    volumes:
      - ./Kenworth_Recursos_de_Prueba:/app/resources:ro
      - decisions:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
volumes:
  decisions:
